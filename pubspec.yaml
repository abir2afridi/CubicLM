name: cubiclm
description: AI Chat — Local/Cloud LLM Assistant
publish_to: "none"
version: 1.15.1+24

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Persistent Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local AI Inference (Android)
  llama_flutter_android: ^0.2.0
  sd_flutter_android:
    path: local_plugins/sd_flutter_android

  # FFI for native library interop
  ffi: ^2.1.2

  # Networking
  dio: ^5.7.0
  http: ^1.2.0

  # Firebase (Crash Reporting)
  firebase_core: ^3.8.0

  # File System & Permissions
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.1.4
  camera: ^0.11.0
  # Pinned exact: 1.9.0 rewrote android/ to .kts without applying
  # kotlin-android, so `kotlin {}` fails script compilation in this
  # project's build (AGP 8.11.1 + flutter-plugin-loader). 1.8.1 uses the
  # classic Groovy script which compiles fine. Do NOT caret this.
  dynamic_color: 1.8.1
  desktop_drop: ^0.5.0

  # Image Support
  image_picker: ^1.1.0
  share_plus: ^10.0.0

  # UI
  google_fonts: ^6.2.0
  flutter_markdown: ^0.7.4
  flutter_markdown_latex: ^0.3.4
  markdown: ^7.2.2

  # Utils
  uuid: ^4.5.0
  intl: ^0.19.0
  crypto: ^3.0.0

  # Background / Boot Persistence
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.0.0
  file_picker: ^11.0.2
  image: ^4.8.0
  flutter_litert_lm:
    path: local_plugins/flutter_litert_lm
  gal: ^2.3.2
  syncfusion_flutter_pdf: ^33.2.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  firebase_crashlytics: ^4.3.10
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0

  archive: any
  xml: any
  lucide_icons: ^0.257.0
  url_launcher: ^6.3.2
  open_file: ^3.5.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.3.0
  flutter_inappwebview: ^6.1.5
  flutter_js: ^0.8.0
  dart_mcp: ^0.5.2
  window_manager: ^0.4.1
  win_toast: ^0.4.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path_provider_platform_interface: ^2.1.2

dependency_overrides:
  # Vendored 0.257.0: `LucideIconData extends IconData` no longer
  # compiles where IconData is final (newer Flutter); replaced with
  # plain const IconData (see local_plugins/lucide_icons/README.md).
  lucide_icons:
    path: local_plugins/lucide_icons
  llama_flutter_android:
    path: local_plugins/llama_flutter_android
  # Vendored 1.0.1 with corrected Windows pluginClass (see note in its
  # pubspec). Upstream bug: tool emits a non-existent register symbol.
  speech_to_text_windows:
    path: local_plugins/speech_to_text_windows

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/skills/
